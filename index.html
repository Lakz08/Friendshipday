<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friendship Test ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Niconne&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="bg-hearts" aria-hidden="true"></div>

  <main class="shell">
    <section class="card" id="app">
      <div class="badge">Friendship Day Edition ✨</div>
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="stepLabel">Question 1 of 4</span>
          <span id="friendshipPct">100%</span>
        </div>
        <div class="progress-bar"><div id="progressFill"></div></div>
      </div>

      <h1 id="title">Hey idiot 👀</h1>
      <p id="subtitle">I have a very important friendship test.</p>

      <div class="meme-box" id="memeBox" style="display:none;">
        <img id="memeImg" alt="Funny meme" />
        <div id="memeCaption" class="meme-caption"></div>
      </div>

      <div id="questionArea">
        <p id="question" class="question">Ready to begin?</p>
        <div id="buttons" class="buttons">
          <button class="btn primary" id="yesBtn">Start ❤️</button>
        </div>
      </div>

      <div id="footerHint" class="footer-hint">Hint: the “No” button is allowed... but it may be a trap 😌</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
